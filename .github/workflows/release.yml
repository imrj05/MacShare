name: Release

# Publish a release by pushing a tag (v0.1.0), or run this workflow manually and
# name the tag. Produces: GitHub Release + DMG + .sha256 + generated changelog.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0 (created at the current commit if missing)'
        required: true
        type: string
  # Called by auto-tag.yml once it has created the version tag.
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Determine tag and version
        id: vars
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          # Do not branch on github.event_name here. A reusable workflow started
          # with workflow_call reports the CALLER's event (auto-tag.yml is a push
          # to main), so event_name is "push" even though inputs.tag was passed.
          # The inputs context is populated for workflow_dispatch/workflow_call
          # and empty on a tag push, so prefer it and fall back to the triggering
          # ref only when there is no input.
          TAG="${INPUT_TAG:-${REF_NAME}}"
          if [ -z "${TAG}" ]; then
            echo "error: no tag resolved" >&2
            exit 1
          fi
          # Fail fast instead of publishing a branch name as a version (this is
          # how "main" once became MacShare-main.dmg on a "main" release).
          if ! printf '%s' "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)*$'; then
            echo "error: resolved tag '${TAG}' is not a v<semver> tag" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${TAG} (version ${TAG#v})"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    with:
      marketing_version: ${{ needs.prepare.outputs.version }}
      # Quoted so the reusable workflow receives a string, not a number.
      build_number: "${{ github.run_number }}"

  release:
    name: DMG, changelog and GitHub Release
    needs: [prepare, build]
    # Override without editing this file: repo variable MACOS_RUNNER
    runs-on: ${{ vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Tag pushes use github.ref; auto-tag/manual runs pass inputs.tag
          ref: ${{ inputs.tag || github.ref }}

      - name: Download built app
        uses: actions/download-artifact@v4
        with:
          name: MacShare-app

      - name: Unpack app
        run: |
          set -eo pipefail
          unzip -q MacShare.app.zip
          test -d MacShare.app
          chmod +x .github/scripts/*.sh

      - name: Build DMG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eo pipefail
          DMG_PATH="$(.github/scripts/make-dmg.sh MacShare.app "${VERSION}" dist | tail -n 1)"
          test -f "${DMG_PATH}"
          echo "DMG_PATH=${DMG_PATH}" >> "$GITHUB_ENV"
          echo "Built ${DMG_PATH}"

      # Publishes the Sparkle feed consumed by SUFeedURL. Skipped with a warning
      # until the SPARKLE_PRIVATE_KEY repository secret is configured, so releases
      # keep working without it (only in-app updates stay unavailable).
      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eo pipefail
          if [ ! -x .github/scripts/make-appcast.sh ]; then
            echo "::warning::.github/scripts/make-appcast.sh is missing at ${TAG}; skipping appcast.xml"
            exit 0
          fi
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY secret is not set; skipping appcast.xml. In-app updates will not work until it is configured."
            exit 0
          fi
          APPCAST_PATH="$(.github/scripts/make-appcast.sh "${GITHUB_REPOSITORY}" "${TAG}" "${VERSION}" dist | tail -n 1)"
          test -f "${APPCAST_PATH}"
          echo "APPCAST_PATH=${APPCAST_PATH}" >> "$GITHUB_ENV"
          echo "Built ${APPCAST_PATH}"

      - name: Generate changelog
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eo pipefail
          # On a manual run the tag may not exist yet; document HEAD in that case.
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            REV="${TAG}"
          else
            REV="HEAD"
          fi
          .github/scripts/changelog.sh "${REV}" > release-notes.md
          cat release-notes.md

      # Only writes the file back when the tag commit is on the default branch tip;
      # a protected or moved branch fails this step without failing the release.
      - name: Update CHANGELOG
        continue-on-error: true
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eo pipefail
          .github/scripts/update-changelog.sh release-notes.md CHANGELOG
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG
          if git diff --cached --quiet; then
            echo "CHANGELOG already up to date"
            exit 0
          fi
          git commit -m "docs: changelog for ${TAG}"
          git push origin "HEAD:${DEFAULT_BRANCH}"

      # The release body is the changelog plus the install instructions, so every
      # release explains how to get past Gatekeeper. CHANGELOG itself stays
      # changelog-only, which is why this builds a separate file.
      - name: Assemble release body
        run: |
          set -eo pipefail
          FOOTER=".github/release-notes-footer.md"
          cp release-notes.md release-body.md
          if [ -s "$FOOTER" ]; then
            printf '\n---\n\n' >> release-body.md
            cat "$FOOTER" >> release-body.md
          else
            echo "warning: $FOOTER is missing; releasing without install instructions" >&2
          fi
          echo "--- release body ---"
          cat release-body.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eo pipefail
          TITLE="Mac Share ${VERSION}"
          ASSETS=("${DMG_PATH}" "${DMG_PATH}.sha256")
          # appcast.xml is optional: it is skipped when SPARKLE_PRIVATE_KEY is unset.
          if [ -n "${APPCAST_PATH:-}" ] && [ -f "${APPCAST_PATH}" ]; then
            ASSETS+=("${APPCAST_PATH}")
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-body.md
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
          elif git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            gh release create "${TAG}" "${ASSETS[@]}" --title "${TITLE}" --notes-file release-body.md
          else
            gh release create "${TAG}" "${ASSETS[@]}" --title "${TITLE}" --notes-file release-body.md --target "${GITHUB_SHA}"
          fi
          gh release view "${TAG}" --json url --jq '"Release: " + .url'

      - name: Upload release assets as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MacShare-release
          path: |
            dist/*.dmg
            dist/*.sha256
            dist/appcast.xml
            release-notes.md
            release-body.md
          if-no-files-found: error
          retention-days: 30
